<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Card Preview</title>
  <style>
    /* Background just for the preview */
    body {
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }

    /* --- Exact CSS you will use in your project --- */
    .unlock-modal__dialog {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      padding: 1.75rem;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .unlock-modal__close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: #64748b;
      cursor: pointer;
      line-height: 1;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
    }
    
    .unlock-modal__close:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .unlock-modal__badge {
      display: inline-block;
      background: #dbeafe;
      color: #2563eb;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 0.5rem;
    }

    .unlock-modal__title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
    }

    .unlock-modal__subtitle {
      margin: 0.35rem 0 1.25rem;
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.4;
    }

    .unlock-modal__step {
      display: flex;
      gap: 0.875rem;
      margin-bottom: 1.25rem;
    }

    .unlock-modal__step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      background: #2563eb;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.875rem;
    }

    .unlock-modal__step-content {
      flex: 1;
    }

    .unlock-modal__step-text {
      margin: 0 0 0.5rem;
      font-size: 0.875rem;
      color: #334155;
      line-height: 1.4;
    }

    .unlock-modal__label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
    }

    .unlock-modal__btn-telegram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: #229ed9;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.625rem 1rem;
      border-radius: 8px;
      transition: background 0.2s;
      box-sizing: border-box;
    }

    .unlock-modal__btn-telegram:hover {
      background: #1a8abe;
    }

    .unlock-modal__input-group {
      display: flex;
      gap: 0.5rem;
    }

    .unlock-modal__input {
      flex: 1;
      padding: 0.625rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .unlock-modal__input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .unlock-modal__btn-submit {
      background: #2563eb;
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.625rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .unlock-modal__btn-submit:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <!-- --- Exact HTML you will use in your project --- -->
  <div class="unlock-modal__dialog">
    <button class="unlock-modal__close" type="button" aria-label="Close">&times;</button>
    
    <div class="unlock-modal__header">
      
      <h3 class="unlock-modal__title">သင်္ချာ မေးခွန်းလွှာ လော့ခ်ဖွင့်ရန်</h3>
      <p class="unlock-modal__subtitle">မေးခွန်း ၆၀၀ ကျော် နှင့် အဖြေရှင်းလင်းချက်များကို အကန့်အသတ်မရှိ လေ့ကျင့်နိုင်မည်။</p>
    </div>

    <div class="unlock-modal__body">
      <div class="unlock-modal__step">
        <span class="unlock-modal__step-num">1</span>
        <div class="unlock-modal__step-content">
          <p class="unlock-modal__step-text">အောက်ပါ Telegram Bot တွင် ၃,၀၀၀ ကျပ် ပေးသွင်းပြီး Activation Code ရယူပါ။</p>
          <a href="https://t.me/AuxiliusBot" class="unlock-modal__btn-telegram" target="_blank" rel="noopener noreferrer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.37-.49 1.02-.75 3.99-1.73 6.66-2.87 8.01-3.43 3.81-1.58 4.6-1.86 5.12-1.86.11 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.02.19-.04.32z"/>
            </svg>
            Telegram Bot မှ ကုဒ်တောင်းမည်
          </a>
        </div>
      </div>

      <div class="unlock-modal__step">
        <span class="unlock-modal__step-num">2</span>
        <div class="unlock-modal__step-content">
          <label for="ged-code-input" class="unlock-modal__label">ရရှိလာသော Code ကို အောက်တွင် ထည့်သွင်းပါ</label>
          <div class="unlock-modal__input-group">
            <input type="text" id="ged-code-input" class="unlock-modal__input" placeholder="ဥပမာ - MATH-12345" />
            <button type="button" class="unlock-modal__btn-submit">
              လော့ခ်ဖွင့်မည်
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
