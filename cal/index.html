<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator-JS | By Bocaletto Luca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="calculator.css">
  <style>
    /* Add this inside the <style> of cal/index.html */
@media (max-width: 576px) {
  /* Force the container to take full width and remove margins */
  body .container.my-4 {
    padding-left: 0 !important;
    padding-right: 0 !important;
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    max-width: 100% !important;
  }

  /* Make the card take 100% of the space and remove its borders so it blends with the parent modal */
  .calculator-card {
    width: 100% !important;
    max-width: 100% !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }

  /* Reduce padding slightly so buttons have maximum room to stretch */
  .calculator-card .card-body {
    padding: 1rem 0.5rem !important; 
  }
}
  </style>
</head>
<body>
  <div class="container my-4">
    
   
    <div class="card shadow-sm calculator-card mx-auto">
      <div class="card-body">
        <!-- Display area -->
        <div id="display" class="form-control text-end fs-3 mb-3" readonly>0</div>
        
        <!-- Button Grid -->
        <!-- Row 1: AC, DEL, (, ) -->
        <div class="row g-2 mb-2">
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-danger" data-value="AC">AC</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-warning" data-value="DEL">DEL</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="(">(</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value=")">)</button>
          </div>
        </div>
        
        <!-- Row 2: sin, cos, tan, ÷ -->
        <div class="row g-2 mb-2">
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="sin(">sin</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="cos(">cos</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="tan(">tan</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="÷">÷</button>
          </div>
        </div>
        
        <!-- Row 3: log, ln, √, × -->
        <div class="row g-2 mb-2">
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="log(">log</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="ln(">ln</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="√(">√</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="×">×</button>
          </div>
        </div>
        
        <!-- Row 4: 7, 8, 9, − -->
        <div class="row g-2 mb-2">
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="7">7</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="8">8</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="9">9</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="−">−</button>
          </div>
        </div>
        
        <!-- Row 5: 4, 5, 6, + -->
        <div class="row g-2 mb-2">
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="4">4</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="5">5</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="6">6</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="+">+</button>
          </div>
        </div>
        
        <!-- Row 6: 1, 2, 3, x^y -->
        <div class="row g-2 mb-2">
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="1">1</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="2">2</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="3">3</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-secondary" data-value="^">x^y</button>
          </div>
        </div>
        
        <!-- Row 7: 0, ., π, = -->
        <div class="row g-2 mb-2">
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="0">0</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value=".">.</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-light" data-value="π">π</button>
          </div>
          <div class="col-3">
            <button type="button" class="btn btn-calculator btn-success" data-value="=">=</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JavaScript (Calculator-JS logic) -->
  <script src="calculator.js"></script>
  



</body>
</html>
